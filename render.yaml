# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Deploys VKStat as:
#   - managed Postgres (with unaccent + pg_trgm extensions — added at migration time)
#   - managed Key Value (Redis-compatible) for the RQ queue
#   - web service (FastAPI) — runs `alembic upgrade head` then uvicorn
#   - worker (RQ consumer) — processes scrape/metrics jobs
#   - scheduler (rq-scheduler) — registers cron-style recurring jobs
#
# Setup after `New -> Blueprint`:
#   1. Point Render at this repo and branch.
#   2. In the `vkstat` env var group set VK_TOKENS (service token from VK
#      « Налаштування API»; comma-separated for a pool).
#   3. Deploy.
#
# Plan notes:
#   - web + Postgres + Key Value run on free. Free web sleeps after 15 min of
#     inactivity; free Postgres expires after ~90 days.
#   - Render background workers require Starter+ ($7/mo each).

databases:
  - name: vkstat-postgres
    databaseName: vkstat
    user: vkstat
    plan: free
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: vkstat-redis
    plan: free
    ipAllowList: []

  - type: web
    name: vkstat-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    # Migrations run as part of startup so the first request never hits an
    # un-migrated DB. Idempotent — alembic is a no-op when up to date.
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vkstat-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: vkstat-redis
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"
      - fromGroup: vkstat

  - type: worker
    name: vkstat-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true
    dockerCommand: python -m app.workers.worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vkstat-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: vkstat-redis
          property: connectionString
      - fromGroup: vkstat

  - type: worker
    name: vkstat-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true
    dockerCommand: python -m app.workers.scheduler
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vkstat-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: vkstat-redis
          property: connectionString
      - fromGroup: vkstat

# envVarGroups only accept plain key/value entries (no fromDatabase/fromService).
# Cross-service references live inside each service's envVars above.
envVarGroups:
  - name: vkstat
    envVars:
      - key: VK_TOKENS
        sync: false
      - key: VK_API_VERSION
        value: "5.199"
